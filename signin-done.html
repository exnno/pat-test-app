     Google (via Supabase) returns here, inside the window PATGo opened. This page
     hands what came back — the session in the #fragment, or an error — to the
     app that opened it, wipes the address bar, and closes. The app checks the
     sender is our own origin and that a Google tap is waiting (cloud.js
     cloudGoogleReturn). Nothing is stored here and nothing is sent anywhere else.
     It must be listed in Supabase → Auth → URL Configuration → Redirect URLs. -->
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>PATGo</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 32px 20px; font: 16px/1.5 -apple-system, system-ui, sans-serif;
           background: #f9fafb; color: #111827; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e5e7eb; } }
  </style>
</head>
<body>
  <p id="m">Finishing…</p>
  <script>
  (function () {
    'use strict';
    // Only these are passed on; anything else in the address is ignored.
    var KEYS = ['access_token', 'refresh_token', 'expires_in', 'expires_at', 'token_type', 'type',
                'error', 'error_code', 'error_description'];
    var params = {};
    function take(str) {
      try {
        new URLSearchParams(str).forEach(function (v, k) {
          if (KEYS.indexOf(k) !== -1 && !(k in params)) params[k] = v;
        });
      } catch (e) {}
    }
    take(location.hash.slice(1));
    take(location.search.slice(1));
    try { history.replaceState(null, '', location.pathname); } catch (e) {}   // wipe the tokens from the address
    var msg = { type: 'patgo-google-return', params: params };
    try { if (window.opener && !window.opener.closed) window.opener.postMessage(msg, location.origin); } catch (e) {}
    try {
      if (typeof BroadcastChannel === 'function') {
        var ch = new BroadcastChannel('patgo-google-return');
        ch.postMessage(msg);
        setTimeout(function () { try { ch.close(); } catch (e) {} }, 1000);
      }
    } catch (e) {}
    var m = document.getElementById('m');
    m.textContent = params.error || params.error_code
      ? 'Google didn’t finish. Go back to PATGo to see why.'
      : 'Done — going back to PATGo…';
    setTimeout(function () {
      try { window.close(); } catch (e) {}
      m.textContent = 'You can close this window and go back to PATGo.';
    }, 400);
  })();
  </script>
</body>
</html>
