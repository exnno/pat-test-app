<!DOCTYPE html>
<!-- PATGo PWA — (c) 2026 Peter Birchley. All rights reserved. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e3a8a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PATGo">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>PATGo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <!-- v22: app.js fully split into single-concern modules. ORDER MATTERS —
       load top to bottom; later files may call functions defined earlier.
       data/state/utils/storage → feature files → render → events → boot.
       boot.js runs the startup block and MUST stay LAST. -->
  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="clients.js"></script>
  <!-- v66: instruments.js — the test-instrument list, its CRUD and its two
       settings renders. Placed immediately after clients.js because it is the
       same kind of thing (a managed list of records with its own persistence and
       settings UI) and, like clients, storage.js's load()/save() call into it.
       Every cross-file call resolves at call time, so the position is a
       readability choice, not a load-order constraint. -->
  <script src="instruments.js"></script>
  <script src="sqp.js"></script>
  <script src="multipick.js"></script>
  <script src="feedback.js"></script>
  <script src="bugreport.js"></script>
  <script src="photos.js"></script>
  <script src="csv.js"></script>
  <script src="backup.js"></script>
  <script src="session.js"></script>
  <script src="setup.js"></script>
  <script src="tour.js"></script>
  <!-- v30: vendored PDF engine (jsPDF + autotable, MIT — see THIRD-PARTY-LICENSES.txt).
       v51: NO LONGER loaded here. These ~350 KB libs only matter when a PDF report
       is produced, so loading them on every cold start was wasted startup cost. They
       remain in sw.js's ASSETS precache (downloaded at SW install, served from cache)
       and are injected on first report by loadReportEngine() in report.js — so
       reports still work fully offline from first install. -->
  <script src="report.js"></script>
  <script src="pdfpreview.js"></script>
  <script src="render-core.js"></script>
  <script src="render-settings.js"></script>
  <!-- v65: HID barcode scanner. Placed with the other input-handling files and
       AFTER the render files, because a scan writes into fields those render —
       and before events.js/dispatch.js purely so the three document-level
       capture listeners read together. boot.js arms it. -->
  <script src="scanner.js"></script>
  <script src="events.js"></script>
  <script src="dispatch.js"></script>
  <script src="boot.js"></script>
</body>
</html>
